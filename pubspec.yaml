name: fleetguard
description: "Système complet de gestion et suivi de flotte de camions avec hardware embarqué, logiciel multiplateforme et intelligence artificielle"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  # Networking
  dio: ^5.6.0
  http: ^1.2.0
  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  # Location services
  geolocator: ^11.0.0
  # MQTT client for IoT messaging
  mqtt_client: ^10.2.0
  # Utilities
  intl: ^0.19.0
  # Media capture
  image_picker: ^1.1.2
  # Bluetooth serial for OBD2
  flutter_bluetooth_serial: ^0.4.0
  # Bluetooth Low Energy support
  flutter_blue_plus: ^1.34.5
  # Charts for live graphs (compatible with Flutter 3.22+)
  fl_chart: ^1.1.1
  # Runtime permissions
  permission_handler: ^12.0.1
  # Device info to detect SDK version (used for permission flow)
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_shtt.jpeg
